name: Center slot display
on:
  push:
    paths:
      - '.github/workflows/center-slot.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center slot buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.slot{min-width:34px;min-height:48px;font-size:14px;white-space:nowrap;padding-left:0;padding-right:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}'
          new='.slot{min-width:34px;min-height:48px;font-size:14px;white-space:nowrap;padding-left:0;padding-right:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;margin-left:auto;margin-right:auto}'
          if old not in s:
              raise SystemExit('target CSS not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Center slot display in each cell'
          git push