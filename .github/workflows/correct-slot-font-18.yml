name: Correct slot font to 18
on:
  push:
    paths:
      - '.github/workflows/correct-slot-font-18.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct font target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('\n.desktop-slots thead th:not(:first-child){font-size:18px}','',1)
          old='.slot{min-width:34px;min-height:48px;font-size:14px;white-space:nowrap;padding-left:0;padding-right:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;margin-left:auto;margin-right:auto}'
          new='.slot{min-width:34px;min-height:48px;font-size:18px;white-space:nowrap;padding-left:0;padding-right:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;margin-left:auto;margin-right:auto}'
          if old not in s:
              raise SystemExit('slot CSS target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Set mobile slot status font to 18px'
          git push
