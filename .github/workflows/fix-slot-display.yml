name: Fix slot display

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-slot-display.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update slot display only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<button class="slot limited"([^>]*)>残り(\d+)枠</button>', r'<button class="slot limited"\1>△<span class="slot-rest">（残\2）</span></button>', s)
          s = re.sub(r'<button class="slot"([^>]*)>残り(\d+)枠</button>', r'<button class="slot"\1>○<span class="slot-rest">（残\2）</span></button>', s)
          old = '.slot{min-width:34px;min-height:48px;font-size:10px;white-space:nowrap;padding-left:0;padding-right:0}'
          new = '.slot{min-width:34px;min-height:48px;font-size:14px;white-space:nowrap;padding-left:0;padding-right:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}.slot-rest{display:block;font-size:10px;line-height:1.15}'
          if old not in s:
              raise SystemExit('mobile slot CSS target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Center slot symbols and remaining count'
          git push
