name: Set remaining count font 18
on:
  push:
    paths:
      - '.github/workflows/slot-rest-font-18.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.slot-rest{display:block;font-size:10px;line-height:1.15}'
          new='.slot-rest{display:block;font-size:18px;line-height:1.15}'
          if old not in s: raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Set mobile remaining count font to 18px'
          git push
