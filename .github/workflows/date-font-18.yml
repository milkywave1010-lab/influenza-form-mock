name: Set date font 18
on:
  push:
    paths:
      - '.github/workflows/date-font-18.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set date header font only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='.desktop-slots th:not(:first-child),.desktop-slots td:not(:first-child){padding-left:3.55px;padding-right:3.55px}'
          add=marker+'\n.desktop-slots thead th:not(:first-child){font-size:18px}'
          if marker not in s:
              raise SystemExit('target CSS not found')
          p.write_text(s.replace(marker,add,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Set mobile date header font to 18px'
          git push
